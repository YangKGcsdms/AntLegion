<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F7F8FA">
<title>AntLegion · 本地总线控制台</title>



<link rel="stylesheet" href="/console-assets/tokens.css">
<link rel="stylesheet" href="/console-assets/components.css">
<link rel="stylesheet" href="/console-assets/console.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="layout">
<aside class="sidebar" aria-label="主导航">
<div class="wordmark"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 24 16 6l9 18M11 17h10M4 26h24M16 6v20" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="6" r="2" fill="currentColor"/></svg>AntLegion</div>
<div class="sidebar-sub">本地总线控制台</div>
<nav class="nav" id="nav"></nav>
<div class="sidebar-bottom"><div class="sidebar-foot"><button class="helpbtn" data-nav="ops" data-access="protocol"><span id="help-icon"></span>理解事实协议<span aria-hidden="true">↗</span></button><div class="local-box">本地实例<br><span class="small">只读观察 · 不修改日志</span></div></div></div>
</aside>
<div class="app">
<header class="topbar"><div class="bus"><span class="bus-icon" id="bus-icon"></span><div class="od-field"><span class="kicker">当前总线</span><button class="bus-address mono od-truncate" id="address-btn" title="连接设置">正在连接</button></div><span id="connection-badge" class="badge good"><span class="dot"></span>连接中</span></div><div class="top-right"><span class="top-time" id="last-update">尚未读取</span><span class="freshness-badge" id="freshness-badge" hidden></span><button class="btn" id="credentials-btn" hidden>登录 / 访问令牌</button><button class="btn" id="refresh-btn"></button></div></header>
<div class="connection-banner" id="connection-banner" role="status" hidden></div>
<div class="freshness-note" id="freshness-note" role="status" hidden></div>
<main id="main" class="content" tabindex="-1"></main>
</div></div>
<dialog class="drawer" id="fact-drawer" aria-labelledby="fact-title"><div id="drawer-header" class="drawer-head"></div><div id="drawer-content" class="drawer-body"></div><div id="drawer-footer" class="drawer-foot"></div></dialog>
<dialog class="settings" id="settings" aria-labelledby="settings-title"><form id="connect-form"><div class="settings-head"><h2 id="settings-title">登录总线</h2><button type="button" class="btn small" data-close-settings>关闭</button></div><p class="small muted">控制台连接当前页面所在的总线。切换实例请打开目标实例的 /console 地址。</p><div class="field"><label for="bus-token">访问令牌（未启用认证时留空）</label><input id="bus-token" type="password" autocomplete="off"></div><p class="small muted">令牌仅保存在当前标签页的会话存储中，不写入事实或接入示例。</p><div class="btns"><button class="btn primary" type="submit">验证并连接</button></div><p id="auth-error" role="alert" class="error-text"></p></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/console-assets/console.js" defer></script>
</body></html>
