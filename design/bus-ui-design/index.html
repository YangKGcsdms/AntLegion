function ops(){let body='';if(state.access==='protocol'){body=`<h2>理解事实与计算结果</h2><p class="intro-copy section-gap">AntLegion 让不同程序与智能体共享事实。控制台读取日志，按协议计算状态，不修改已经追加的事实。</p><div class="step"><span class="step-number">01</span><div><h3>事实按顺序追加</h3><p>序号代表日志位置。事实编号用于引用事实，本原型使用 demo-fact-* 作为示例编号。</p></div></div><div class="step"><span class="step-number">02</span><div><h3>关联事实解释变化</h3><p>#145 替代 #141；#146、#147、#148 分别记录认领、分析与解决。</p><div class="fact-path">${[141,145,146,147,148].map(n=>factButton(n,'#'+n,'btn small')).join('')}</div></div></div><div class="step"><span class="step-number">03</span><div><h3>计算结果有读取边界</h3><p>在详情中切换计算序号，可以观察尚未认领、已认领与已解决的变化。正式接入时还需确认撤销、释放及签名校验规则。</p></div></div><div class="notice"><div><strong>当前无法确认</strong><p>协议版本、正式接口路径、SDK 包与签名校验规则未提供；接入示例不应直接作为真实服务调用代码。</p></div></div>`;}else{const ex=examples[state.access];body=`<h2>${ex.title}</h2>${ex.steps.map(([t,d],i)=>`<div class="step"><span class="step-number">0${i+1}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}<div class="code-top"><span>${ex.lang}</span><button class="btn small" data-copy-code>${icon('copy')}复制示例</button></div><pre id="access-code"><code>${esc(ex.code)}</code></pre><p class="safety-label">代码仅用于说明接入顺序，路径、字段与命令需按实际协议文档确认；不含真实令牌。</p>`;}
return pageHead('接入与运维','连接本地总线，了解读取事实与状态计算的边界。')+`<div class="tabbar" role="tablist" aria-label="接入方式">${[['http','HTTP'],['cli','命令行 alctl'],['sdk','Node.js SDK'],['protocol','协议说明']].map(([v,l])=>`<button role="tab" aria-selected="${state.access===v}" data-access-tab="${v}">${l}</button>`).join('')}</div><div class="ops-grid"><section>${body}</section><aside class="service-info"><h2>服务信息</h2><div class="service-pair"><span>总线地址</span><span class="mono wrap">${esc(state.url)}</span></div><div class="service-pair"><span>连接状态</span><span>${state.connection==='ok'?'已连接（示例）':state.connection==='denied'?'无读取权限':'连接失败'}</span></div><div class="service-pair"><span>协议版本</span><span>未知 · 待服务返回</span></div><div class="service-pair"><span>部署方式</span><span>本地部署</span></div><div class="service-pair"><span>日志头 / 已计算</span><span class="mono">#148 / #148</span></div><div class="service-pair"><span>访问令牌</span><span>${state.token?'已输入 · 仅存于内存':'未配置 · 示例只读权限'}</span></div><button class="btn" data-settings>${icon('server')}配置连接</button><p class="safety-label">总线数据、连接反馈均为本地演示，不探测实际服务。</p></aside></div>${footer()}`;}
function render(){renderNav();const pages={overview,facts:factsPage,world,agents,ops};$('#main').innerHTML=`<div class="page">${state.loading?skeleton():state.connection!=='ok'&&state.page!=='ops'?pageHead(navs.find(n=>n[0]===state.page)[1],'读取总线数据前需要建立有效连接。')+blocked():pages[state.page]()}</div>`;updateTop();}
function stale(){return state.connection!=='ok'||Date.now()-state.readAt>=300000;}
function updateFreshness(){
const old=stale(),flag=$('#freshness-badge'),note=$('#freshness-note');flag.hidden=!old;note.hidden=!old;
if(old){flag.innerHTML=icon('clock')+'数据已过期';note.innerHTML=`${icon('clock')}<div class="od-fill"><strong>当前结果来自上次成功读取的数据</strong><p>最后计算到 #148；${state.connection==='ok'?'已超过 5 分钟未成功刷新，':'连接尚未恢复，'}无法确认总线是否有新事实。旧结果仍有读取边界，不代表当前完整状态。</p></div><button class="text-link" data-refresh-snapshot>重新读取</button>`;}
}
function updateTop(){ $('#address-btn').textContent=state.url;$('#last-update').textContent=`读取于 ${state.updated}`;const ok=state.connection==='ok';$('#connection-badge').className='badge '+(ok?'good':state.connection==='denied'?'warn':'error');$('#connection-badge').innerHTML=`<span class="dot"></span>${ok?'已连接':state.connection==='denied'?'无权限':'连接失败'}`;$('#refresh-btn').innerHTML=icon('refresh')+(state.loading?'刷新中':'刷新');$('#refresh-btn').disabled=state.loading;const b=$('#connection-banner');b.hidden=ok;if(!ok)b.innerHTML=`<span>${state.connection==='denied'?'没有读取权限。请检查访问令牌。':'无法连接当前总线。请检查地址及服务。'} 最后成功读取到 #148。</span><button class="text-link" data-settings>检查设置</button>`;updateFreshness();}
function navigate(page){state.page=page;render();$('#main').focus({preventScroll:true});window.scrollTo({top:0});}
function showToast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('#toast').hidden=true,3200);}
async function copy(text){try{if(!navigator.clipboard)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);showToast('已复制到剪贴板');}catch{const source=$('#access-code')||$('#json-code');if(source){const range=document.createRange();range.selectNodeContents(source);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);showToast('自动复制不可用，已选中代码，请按 Ctrl+C 或 ⌘C');}else showToast('当前环境不支持自动复制，请手动选择内容');}}
function runQuery(value){const input=value??$('#topic-input').value.trim();state.topicInput=input;state.worldCutoff=Number($('#world-cutoff')?.value||state.worldCutoff);if(!input){state.worldQuery=null;state.worldLoading=false;render();$('#topic-input')?.focus();return;}state.worldLoading=true;state.worldQuery=input;render();setTimeout(()=>{state.worldLoading=false;if(state.page==='world')render();},550);}
function showFact(n,push=true){if(!factBy(n))return;const d=$('#fact-drawer');if(!d.open){state.returnFocus=document.activeElement;state.history=[];state.drawerCutoff=148;state.drawerTab='overview';}else if(push&&state.fact!==Number(n)){state.history.push({fact:state.fact,tab:state.drawerTab,cutoff:state.drawerCutoff});state.drawerTab='overview';}state.fact=Number(n);renderDrawer();if(!d.open)d.showModal();$('#drawer-close').focus();}
function relationTree(cutoff=148,current=null){
const node=(n,text)=>`<button class="relation-node" data-open-fact="${n}" ${current===n?'aria-current="true"':''}><span class="mono">#${n}</span><span>${esc(text)}</span></button>`;
const edge=(label,n,text)=>`<div class="relation-edge"><span class="relation-label">${esc(label)} ${icon('arrow')}</span>${node(n,text)}</div>`;
const branches=[[146,'被认领','认领记录'],[147,'后续事实','分析结果'],[148,'被解决','解决记录']].filter(([n])=>n<=cutoff);
return `<div class="relation-tree" aria-label="service:api:status 的事实关系"><ul><li>${node(141,'服务正常')}${cutoff>=145?`<ul class="relation-children"><li>${edge('被替代',145,'错误率升高')}${branches.length?`<ul class="relation-children">${branches.map(([n,label,text])=>`<li>${edge(label,n,text)}</li>`).join('')}</ul>`:''}</li></ul>`:''}</li></ul></div>`;
}
function relatedMarkup(f){let html=([141,145,146,147,148].includes(f.seq)&&state.drawerTab==='relations')?`<section><div class="section-head"><h3>主题关系</h3><span class="mono muted">计算到 #${state.drawerCutoff}</span></div>${relationTree(state.drawerCutoff,f.seq)}<p class="relation-tree-note">三个分支均关联 #145；不表示 #146、#147、#148 相互引用。点击事实查看原始关联依据。</p></section>`:'';const before=f.refs||[];html+=`<section><h3>前因事实</h3>${before.length?before.map(n=>relation(factBy(n),f.seq===145?'被本事实替代':'本事实关联的目标')).join(''):'<p class="small muted section-gap">已载入片段中未提供前因引用。</p>'}</section>`;const after=facts.filter(x=>(x.refs||[]).includes(f.seq)&&x.seq<=state.drawerCutoff);html+=`<section><h3>后续事实</h3>${after.length?after.map(x=>relation(x,x.type==='_.claim'?'被认领 · 认领依据':x.type==='_.resolve'?'被解决 · 解决依据':x.type==='service.status'?'被替代 · 替代依据':'后续事实 · 分析结果')).join(''):'<p class="small muted section-gap">当前计算范围内没有后续引用事实。</p>'}</section>`;if([146,147,148].includes(f.seq)){const others=facts.filter(x=>(x.refs||[]).includes(145)&&x.seq!==f.seq&&x.seq<=state.drawerCutoff);html+=`<section><h3>同一目标 #145 的其他后续事实</h3>${others.map(x=>relation(x,x.type==='analysis.completed'?'查看后续分析事实':x.type==='_.resolve'?'解决依据':'认领依据')).join('')}</section>`;}return html;}
function relation(f,label){return `<button class="relation" data-open-fact="${f.seq}"><span class="od-field"><strong><span class="mono">#${f.seq} · ${esc(f.type)}</span></strong><small>${esc(f.summary)}</small><small class="relation-kind">${esc(label)}</small></span>${icon('arrow')}</button>`;}
function renderDrawer(){const f=factBy(state.fact),cut=state.drawerCutoff,claim=cut>=146,resolve=cut>=148;$('#drawer-header').innerHTML=`<div class="drawer-top"><div class="od-row">${state.history.length?'<button class="drawer-back" data-fact-back>'+icon('back')+' 返回上一事实</button>':'<span class="kicker">事实详情</span>'}<span class="demo-tag">示例数据</span></div><button id="drawer-close" class="icon-btn" aria-label="关闭事实详情" data-close-fact>${icon('close')}</button></div><div class="drawer-title"><h2 id="fact-title">事实 <span class="mono">#${f.seq}</span></h2><span class="badge mono">${esc(f.type)}</span></div>`;
const raw={seq:f.seq,id:factId(f),type:f.type,author:f.author,received_at:'2026-11-05T'+f.time+'+08:00',...(f.subject?{subject:f.subject}:{}),...(f.refs?{references:f.refs.map(n=>factId(factBy(n)))}:{}),content:f.data};
let body=`<div class="tabbar" role="tablist" aria-label="事实详情分区">${[['overview','概览'],['relations','关联事实'],['json','原始 JSON']].map(([v,l])=>`<button role="tab" aria-selected="${state.drawerTab===v}" data-drawer-tab="${v}">${l}</button>`).join('')}</div>`;
if(state.drawerTab==='json')body+=`<div class="code-top"><span>展示结构为原型示意，非正式协议定义</span><button class="btn small" data-copy-json>${icon('copy')}复制</button></div><pre id="json-code"><code>${esc(JSON.stringify(raw,null,2))}</code></pre>`;
else if(state.drawerTab==='relations')body+=relatedMarkup(f);
else{body+=`<section><h3>基本信息</h3><dl class="details-grid"><dt>事实编号</dt><dd class="mono">${factId(f)}</dd><dt>作者</dt><dd><button class="text-link mono" data-agent-from-fact="${esc(f.author)}">${esc(f.author)}</button></dd><dt>总线接收时间</dt><dd class="mono">2026-11-05 ${f.time}</dd>${f.subject?`<dt>主题</dt><dd><button class="text-link mono" data-topic-from-fact="${f.subject}">${f.subject}</button></dd>`:''}<dt>签名校验</dt><dd>未知 · 原型未执行校验</dd></dl></section><section><h3>内容</h3><p class="section-gap" style="margin-top:12px">${esc(f.summary)}</p>${f.extra?'<p class="safety-label">此声明或心跳为演示补充数据。</p>':''}<pre class="fact-detail-code"><code>${esc(JSON.stringify(f.data,null,2))}</code></pre></section>`;
if(f.seq===145){body+=`<section class="result-block"><div class="od-row"><h3 class="od-fill">当前计算结果</h3><span class="badge">计算结果</span></div><div class="field section-gap"><label for="drawer-cutoff">计算到日志序号</label><select id="drawer-cutoff">${[145,146,147,148].map(n=>`<option value="${n}" ${cut===n?'selected':''}>#${n}</option>`).join('')}</select></div><div class="result-status"><div><span>认领状态</span>${claim?factButton(146,'已认领 · 查看依据 #146'):'尚未认领'}</div><div><span>是否已解决</span>${resolve?factButton(148,'已解决 · 查看依据 #148'):'未解决'}</div></div><dl class="details-grid"><dt>记录的持有者</dt><dd class="mono">${claim?author:'无认领依据'}</dd><dt>主题当前值</dt><dd>API 错误率升高</dd></dl><p class="small muted">认领与解决分别按示例记录呈现。正式协议是否在解决时释放持有者，需接入后确认；解决记录不会自动恢复主题值。</p></section>`;}else body+=`<section class="result-block"><h3>当前计算结果</h3><dl class="details-grid"><dt>认领状态</dt><dd>未观察到对此事实的认领</dd><dt>持有者</dt><dd>未知 · 无事实依据</dd><dt>是否已解决</dt><dd>未观察到对此事实的解决记录</dd></dl><p class="small muted">${[146,147,148].includes(f.seq)?'本事实关联 #145；其记录的处理动作不等于本事实自身被认领或解决。':'结论仅限已载入的示例片段。'}</p></section>`;
body+=relatedMarkup(f);}
$('#drawer-content').innerHTML=body;$('#drawer-footer').innerHTML=`<div class="od-row"><span class="od-fill">基于已读取事实计算 · 结果不覆盖原始事实</span><span class="mono">计算到 #${cut}</span></div>`;$('#drawer-content').scrollTop=0;}
function closeFact(){if($('#fact-drawer').open)$('#fact-drawer').close();}
$('#fact-drawer').addEventListener('close',()=>{const prev=state.returnFocus;state.fact=null;state.history=[];if(prev?.isConnected)prev.focus({preventScroll:true});else $('#main').focus({preventScroll:true});});
function openSettings(){state.settingsReturn=document.activeElement;$('#bus-url').value=state.url;$('#bus-token').value=state.token;$('#url-error').hidden=true;$('#settings').showModal();$('#bus-url').focus();}
$('#settings').addEventListener('close',()=>{if(state.settingsReturn?.isConnected)state.settingsReturn.focus({preventScroll:true});else $('#address-btn').focus();});
function connect(reset=false){if(!reset){let url;try{url=new URL($('#bus-url').value.trim());if(!['http:','https:'].includes(url.protocol))throw Error();}catch{$('#url-error').hidden=false;$('#bus-url').focus();return;}state.url=url.href.replace(/\/$/,'');state.token=$('#bus-token').value;}else{state.url='http://localhost:28090';state.token='';}state.connection=state.url!=='http://localhost:28090'?'error':state.token?'denied':'ok';$('#settings').close();refresh();}
function refresh(){state.loading=true;const id=++state.refreshId;render();setTimeout(()=>{if(id!==state.refreshId)return;state.loading=false;if(state.connection==='ok'){state.updated=new Date().toLocaleTimeString('zh-CN',{hour12:false});state.readAt=Date.now();}render();showToast(state.connection==='ok'?'示例数据已刷新，日志头仍为 #148':state.connection==='denied'?'读取失败：当前令牌没有权限':'连接失败：请检查总线地址');},650);}
function applyFilter(){const start=$('#filter-start');if(!start.checkValidity()){start.reportValidity();return;}state.filter={type:$('#filter-type').value,author:$('#filter-author').value.trim(),start:start.value};state.pageNo=1;state.loading=true;render();setTimeout(()=>{state.loading=false;if(state.page==='facts')render();},450);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.nav){if(b.dataset.access)state.access=b.dataset.access;navigate(b.dataset.nav);return;}if(b.hasAttribute('data-refresh-snapshot')){refresh();return;}if(b.hasAttribute('data-settings')){openSettings();return;}if(b.dataset.openFact){showFact(b.dataset.openFact);return;}if(b.hasAttribute('data-close-fact')){closeFact();return;}if(b.dataset.drawerTab){state.drawerTab=b.dataset.drawerTab;renderDrawer();$(`[data-drawer-tab="${state.drawerTab}"]`)?.focus();return;}if(b.hasAttribute('data-fact-back')){const prev=state.history.pop();if(prev){state.fact=prev.fact;state.drawerTab=prev.tab;state.drawerCutoff=prev.cutoff;renderDrawer();$('#drawer-close').focus();}return;}if(b.hasAttribute('data-copy-json')){const f=factBy(state.fact);copy($('#json-code').textContent);return;}if(b.hasAttribute('data-copy-code')){copy(examples[state.access].code);return;}if(b.dataset.topicFromFact){const t=b.dataset.topicFromFact;closeFact();state.topicInput=t;state.worldQuery=t;navigate('world');return;}if(b.dataset.agentFromFact){state.agent=b.dataset.agentFromFact;closeFact();navigate('agents');return;}if(b.dataset.topic){state.topicInput=b.dataset.topic;state.worldQuery=b.dataset.topic;state.page='world';runQuery(b.dataset.topic);return;}if(b.hasAttribute('data-query-default')){state.topicInput=topic;state.worldQuery=topic;state.page='world';runQuery(topic);return;}if(b.hasAttribute('data-query')){runQuery();return;}if(b.hasAttribute('data-world-reset')){state.worldQuery=null;state.topicInput='';state.worldCutoff=148;render();return;}if(b.hasAttribute('data-filter')){applyFilter();return;}if(b.hasAttribute('data-clear-filter')){state.filter={type:'',author:'',start:''};state.pageNo=1;render();return;}if(b.dataset.pagination){state.pageNo+=Number(b.dataset.pagination);render();$('#main').focus({preventScroll:true});return;}if(b.dataset.agent){state.agent=b.dataset.agent;render();$('#main').focus();return;}if(b.hasAttribute('data-agent-back')){state.agent=null;render();return;}if(b.dataset.accessTab){state.access=b.dataset.accessTab;render();$(`[data-access-tab="${state.access}"]`)?.focus();return;}if(b.hasAttribute('data-close-settings')){$('#settings').close();return;}if(b.hasAttribute('data-reset-connection')){connect(true);return;}}
const row=e.target.closest('tr[data-fact]');if(row)showFact(row.dataset.fact);
});
$('#address-btn').addEventListener('click',openSettings);$('#refresh-btn').addEventListener('click',refresh);$('#connect-btn').addEventListener('click',()=>connect());
document.addEventListener('change',e=>{if(e.target.id==='drawer-cutoff'){state.drawerCutoff=Number(e.target.value);renderDrawer();$('#drawer-cutoff').focus();}if(e.target.id==='world-cutoff')state.worldCutoff=Number(e.target.value);});
document.addEventListener('input',e=>{if(e.target.id==='topic-input')state.topicInput=e.target.value;if(e.target.id==='bus-url')$('#url-error').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='topic-input'){e.preventDefault();runQuery();}if(['filter-author','filter-start'].includes(e.target.id)){e.preventDefault();applyFilter();}if(['bus-url','bus-token'].includes(e.target.id)){e.preventDefault();connect();}}});
setInterval(()=>{const old=stale();if(old!==state.wasStale){state.wasStale=old;if(!state.loading&&!$('#fact-drawer').open&&!$('#settings').open)render();else updateFreshness();}},15000);
$('#help-icon').innerHTML=icon('info');$('#bus-icon').innerHTML=icon('server');$('[data-close-settings]').innerHTML=icon('close');render();
</script>
</body></html>
