services:
  antlegion-bus:
    build: ./antlegion-bus
    container_name: antlegion-bus
    ports:
      - "28080:28080"
    environment:
      - PORT=28080
      - ANTLEGION_DATA_DIR=/data
      - ANTLEGION_BUS_SECRET=${ANTLEGION_BUS_SECRET:-dev-secret-change-me}
    volumes:
      - bus-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:28080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bus-data:
